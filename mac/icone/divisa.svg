      <stop offset="0" stop-color="#2b2f36"/><stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62c5ee"/><stop offset="1" stop-color="#1186ac"/>
