<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Divisa · Tela do Mac</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
  #cursor { position: absolute; left: 0; top: 0; pointer-events: none; display: none; will-change: transform; }
  #aviso { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    color: #f2f2f4; font: 500 17px/1.4 -apple-system, system-ui, Roboto, sans-serif; text-align: center; background: #0c0d10; padding: 24px; }
  #aviso b { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
  #aviso small { color: #9a9ca3; font-size: 14px; max-width: 420px; }
  #botao { margin-top: 6px; padding: 14px 28px; border-radius: 14px; background: #38a6cf; color: #fff; font-weight: 600; font-size: 17px; }
  .escondido { display: none !important; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<img id="cursor" alt="">
<div id="aviso">
  <b>Divisa</b>
  <span id="texto">Toque para usar este tablet como tela do Mac.</span>
  <span id="botao">Começar</span>
  <small>Dica: dois dedos rolam a página, segurar o dedo é o clique direito. Para a tela não apagar, aumente o tempo de tela do tablet.</small>
</div>
<script>
const canvas = document.getElementById('tela');
const ctx = canvas.getContext('2d', { alpha: false, desynchronized: true });
const aviso = document.getElementById('aviso');
const texto = document.getElementById('texto');
const seta = document.getElementById('cursor');
let ws = null, comecou = false, desenhando = false, fila = [], cursor = null, forma = null;

// Tamanho físico da tela do tablet, deitado. Não usa o tamanho da página: a barra do navegador aparece e some,
// e cada mudança faria o Mac recriar a tela virtual (as janelas pulam e tudo engasga).
function tamanhoEmPixels() {
  const dpr = window.devicePixelRatio || 1;
  const a = Math.round(screen.width * dpr), b = Math.round(screen.height * dpr);
  return { w: Math.max(a, b), h: Math.min(a, b) };
}

function enviar(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }

function conectar() {
  ws = new WebSocket(`ws://${location.hostname}:24803`);
  ws.binaryType = 'arraybuffer';
  ws.onopen = () => { aviso.classList.add('escondido'); enviar({ t: 'tela', ...tamanhoEmPixels() }); };
  ws.onmessage = e => { if (typeof e.data === 'string') receber(JSON.parse(e.data)); else mostrar(e.data); };
  ws.onclose = () => {
    texto.textContent = 'Reconectando ao Mac…';
    document.getElementById('botao').classList.add('escondido');
    aviso.classList.remove('escondido');
    setTimeout(conectar, 1000);
  };
}

// Cada quadro é só o pedaço que mudou (cabeçalho: largura e altura da imagem inteira, x e y do pedaço), então
// nenhum pode ser pulado. O Mac só manda o próximo depois do "ok", e a fila quase nunca passa de um.
function mostrar(buf) {
  fila.push(buf);
  if (!desenhando) desenharProximo();
}

function desenharProximo() {
  const buf = fila.shift();
  if (!buf) return;
  desenhando = true;
  const v = new DataView(buf);
  const W = v.getUint16(0), H = v.getUint16(2), x = v.getUint16(4), y = v.getUint16(6);
  createImageBitmap(new Blob([new Uint8Array(buf, 8)], { type: 'image/jpeg' })).then(img => {
    if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; posicionarCursor(); }
    ctx.drawImage(img, x, y);
    img.close();
  }).catch(() => {}).finally(() => {
    desenhando = false;
    enviar({ t: 'ok' });
    desenharProximo();
  });
}

// ---- Cursor ----
// O Mac manda a posição (fração da tela) e a imagem do cursor; a seta anda aqui, sem esperar o próximo quadro.
function receber(m) {
  if (m.t === 'forma') { forma = m; seta.src = 'data:image/png;base64,' + m.png; }
  else if (m.t === 'cursor') cursor = 'x' in m ? m : null;
  posicionarCursor();
}

function posicionarCursor() {
  if (!cursor || !forma || !canvas.width) { seta.style.display = 'none'; return; }
  const a = areaDaImagem(), w = forma.w * a.w, h = forma.h * a.h;
  seta.style.width = w + 'px';
  seta.style.height = h + 'px';
  seta.style.transform = `translate(${a.x0 + cursor.x * a.w - forma.hx * w}px, ${a.y0 + cursor.y * a.h - forma.hy * h}px)`;
  seta.style.display = 'block';
}

let redimensionar;
window.addEventListener('resize', () => {
  clearTimeout(redimensionar);
  posicionarCursor();
  redimensionar = setTimeout(() => enviar({ t: 'tela', ...tamanhoEmPixels() }), 500);
});

document.getElementById('aviso').addEventListener('click', async () => {
  if (comecou) return;
  comecou = true;
  try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); } catch (e) {}
  try { await screen.orientation.lock('landscape'); } catch (e) {}
  setTimeout(conectar, 300);
});

// ---- Toques ----
// Fração (0…1) do ponto dentro da imagem desenhada (o canvas usa "contain", então pode ter faixas pretas).
function areaDaImagem() {
  const r = canvas.getBoundingClientRect();
  const escala = Math.min(r.width / canvas.width, r.height / canvas.height);
  const w = canvas.width * escala, h = canvas.height * escala;
  return { x0: r.left + (r.width - w) / 2, y0: r.top + (r.height - h) / 2, w, h };
}

function fracao(t) {
  const a = areaDaImagem();
  return { x: (t.clientX - a.x0) / a.w, y: (t.clientY - a.y0) / a.h };
}

const LIMIAR = 8, SEGURAR = 550;
let inicio = null, apertado = false, segurar = null, doisDedos = null;

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 1) {
    const t = e.touches[0];
    inicio = { x: t.clientX, y: t.clientY, f: fracao(t) };
    apertado = false;
    clearTimeout(segurar);
    segurar = setTimeout(() => { if (inicio && !apertado) { enviar({ t: 'direito', ...inicio.f }); inicio = null; } }, SEGURAR);
  } else if (e.touches.length === 2) {
    clearTimeout(segurar);
    if (apertado) { enviar({ t: 'toque', fase: 'fim', ...fracao(e.touches[0]) }); apertado = false; }
    inicio = null;
    doisDedos = centro(e.touches);
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length >= 2 && doisDedos) {
    const c = centro(e.touches), dpr = window.devicePixelRatio || 1;
    enviar({ t: 'rolar', dx: (c.x - doisDedos.x) * dpr, dy: (c.y - doisDedos.y) * dpr });
    doisDedos = c;
    return;
  }
  if (e.touches.length !== 1) return;
  const t = e.touches[0];
  if (inicio && !apertado && Math.hypot(t.clientX - inicio.x, t.clientY - inicio.y) > LIMIAR) {
    clearTimeout(segurar);
    enviar({ t: 'toque', fase: 'inicio', ...inicio.f }); // arrastar começa onde o dedo encostou
    apertado = true;
  }
  if (apertado) enviar({ t: 'toque', fase: 'move', ...fracao(t) });
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  clearTimeout(segurar);
  if (e.touches.length === 0) {
    const t = e.changedTouches[0];
    if (apertado) enviar({ t: 'toque', fase: 'fim', ...fracao(t) });
    else if (inicio) { enviar({ t: 'toque', fase: 'inicio', ...inicio.f }); enviar({ t: 'toque', fase: 'fim', ...inicio.f }); }
    inicio = null; apertado = false; doisDedos = null;
  } else if (e.touches.length === 1) {
    doisDedos = null;
  }
}, { passive: false });

function centro(ts) { return { x: (ts[0].clientX + ts[1].clientX) / 2, y: (ts[0].clientY + ts[1].clientY) / 2 }; }

// Mouse (para testar a página num computador).
let mouseApertado = false;
canvas.addEventListener('mousedown', e => { mouseApertado = true; enviar({ t: 'toque', fase: 'inicio', ...fracao(e) }); });
canvas.addEventListener('mousemove', e => { if (mouseApertado) enviar({ t: 'toque', fase: 'move', ...fracao(e) }); });
canvas.addEventListener('mouseup', e => { mouseApertado = false; enviar({ t: 'toque', fase: 'fim', ...fracao(e) }); });
canvas.addEventListener('contextmenu', e => { e.preventDefault(); enviar({ t: 'direito', ...fracao(e) }); });
canvas.addEventListener('wheel', e => { e.preventDefault(); enviar({ t: 'rolar', dx: -e.deltaX, dy: -e.deltaY }); }, { passive: false });
</script>
</body>
</html>
